[package]
name = "ai-dock"
version = "0.1.0"
description = "A bottom-edge dock for persistent AI terminal sessions"
authors = ["AI Dock contributors"]
edition = "2024"
default-run = "ai-dock"

[lib]
name = "ai_dock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
parking_lot = "0.12"
png = "0.17"
portable-pty = "0.9"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "native-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }
